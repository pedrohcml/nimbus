[project]
name = "nimbus"
version = "0.1.0"
description = "test"
readme = "README.md"
authors = [
    { name = "Pedro Henrique Cavalcante da Motta Lima", email = "phcmlima@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nimbus = "nimbus:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
fmt  = "ruff format ."